name: Verify patches

on:
  push:
    paths:
      - "patches/**"
      - "host_bridge/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "products/**"
      - "build.sh"
      - "build-aosp.sh"
      - ".github/workflows/build.yml"
      - ".github/workflows/patches.yml"
  pull_request:
    paths:
      - "patches/**"
      - "host_bridge/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "products/**"
      - "build.sh"
      - "build-aosp.sh"
      - ".github/workflows/build.yml"
      - ".github/workflows/patches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify LineageOS patches
        run: tests/verify-patches.sh
      - name: Verify AOSP integration patches
        run: python3 -B tests/verify-aosp-patches.py
      - name: Test host tools and product contracts
        run: python3 -B -m unittest discover -s tests -p "test_*.py"
