name: Build Android images

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Operation: legacy build, AOSP inventory, source preparation or AOSP build"
        required: true
        type: choice
        options:
          - lineage
          - inspect-aosp
          - prepare-aosp
          - aosp
        default: lineage
      runner:
        description: "Runner"
        required: true
        type: string
        default: "self-hosted" # ubuntu-latest
      target:
        description: "Build target"
        required: true
        type: choice
        options:
          - arm64only
          - x86_64
          - all
        default: arm64only
      proxy:
        description: "Optional ALL_PROXY URL"
        required: false
        type: string
        default: ""
      no_proxy:
        description: "NO_PROXY hosts (comma-separated)"
        required: false
        type: string
        default: "localhost,127.0.0.1,10.0.0.0/8"
      skip_sync:
        description: "Reuse the runner's existing LineageOS source tree"
        required: false
        type: boolean
        default: false
      skip_checkout:
        description: "Reuse a clean workflow checkout at the requested revision"
        required: false
        type: boolean
        default: false
      reuse_output:
        description: "Verify and publish existing completed build output"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 */16 * *"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  aosp:
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'aosp'
    runs-on: [self-hosted, Linux, X64, android-lineage-qemu]
    timeout-minutes: 720
    concurrency:
      group: aosp-source-and-build
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: aosp-build-control
          persist-credentials: false
      - name: Build and verify AOSP images
        run: bash aosp-build-control/scripts/build-aosp-runner.sh
      - name: Upload verified AOSP images
        uses: actions/upload-artifact@v4
        with:
          name: aosp-arm64-images-${{ github.run_id }}
          path: aosp-build-control/aosp-dist/build.*/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve AOSP diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-build-diagnostics-${{ github.run_id }}
          path: |
            aosp-build-state/*.json
            aosp-build-state/*.txt
            aosp-build-state/*.xml
            aosp-build-state/*.log
            aosp-build-state/*.gz
          retention-days: 7

  prepare-aosp:
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'prepare-aosp'
    runs-on: [self-hosted, Linux, X64, android-lineage-qemu]
    timeout-minutes: 360
    concurrency:
      group: aosp-source-and-build
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: aosp-build-control
          persist-credentials: false
      - name: Record prerequisites before source sync
        run: |
          mkdir -p aosp-build-state
          python3 -B aosp-build-control/scripts/inspect-aosp-runner.py \
            aosp-build-state/runner-inspection.json
      - uses: actions/upload-artifact@v4
        with:
          name: aosp-prerequisites-${{ github.run_id }}
          path: aosp-build-state/runner-inspection.json
          retention-days: 7
      - name: Prepare independent AOSP source
        run: bash aosp-build-control/scripts/prepare-aosp-runner.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aosp-source-preparation-${{ github.run_id }}
          path: |
            aosp-build-state/*.json
            aosp-build-state/*.txt
            aosp-build-state/*.xml
            aosp-build-state/*.log
          retention-days: 7

  inspect-aosp:
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'inspect-aosp'
    runs-on: [self-hosted, Linux, X64, android-lineage-qemu]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: aosp-build-control
          persist-credentials: false
      - name: Inspect build resources
        run: python3 -B aosp-build-control/scripts/inspect-aosp-runner.py "$RUNNER_TEMP/aosp-runner-inspection.json"
      - uses: actions/upload-artifact@v4
        with:
          name: aosp-runner-inspection
          path: ${{ runner.temp }}/aosp-runner-inspection.json
          retention-days: 7

  check:
    if: github.event_name != 'workflow_dispatch' || inputs.build_mode == 'lineage'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
      - id: check
        run: |
          source common.sh
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! check_version; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - name: Clear stale runner proxy
        if: github.event_name != 'workflow_dispatch' || inputs.skip_checkout != true
        run: |
          git config --global --unset-all http.proxy || true
          git config --global --unset-all https.proxy || true
          git config --global --unset-all http.https://github.com.proxy || true

      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch' || inputs.skip_checkout != true
        env:
          HTTP_PROXY: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy || '' }}
          HTTPS_PROXY: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy || '' }}
          ALL_PROXY: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy || '' }}
          NO_PROXY: ${{ inputs.no_proxy }}
        with:
          clean: false

      - name: Validate cached checkout
        if: github.event_name == 'workflow_dispatch' && inputs.skip_checkout == true
        run: |
          test -d .git
          test -x build.sh
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] ||
             ! git diff --quiet HEAD -- build.sh patches scripts tests .github/workflows; then
            echo "Cached build sources do not match the requested revision; disable skip_checkout." >&2
            exit 1
          fi
          git log -1 --oneline

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          SKIP_REPO_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_sync || false }}
          ALL_PROXY: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy || '' }}
          NO_PROXY: ${{ inputs.no_proxy }}
        run: |
          if [[ "${{ inputs.reuse_output }}" == true ]]; then
            product_out=android/lineage/out/target/product/virtio_arm64only
            find "$product_out" -path '*/permissions/*' \
              \( -iname '*gyro*' -o -iname '*compass*' -o -iname '*sensor*' \) \
              -print | sort
            bash -x scripts/verify-build-identity.sh "$product_out"
            cp "$product_out/boot.img" boot_arm64only.img
            cp "$product_out/recovery.img" recovery_arm64only.img
          elif ! ./build.sh; then
            product_out=android/lineage/out/target/product/virtio_arm64only
            for prop in "$product_out"/system/build.prop "$product_out"/vendor/build.prop; do
              if [[ -f "$prop" ]]; then
                echo "Diagnostic properties from $prop:"
                grep -E '^(ro\.build\.fingerprint|ro\.product\.|ro\.soc\.)' "$prop" || true
              fi
            done
            exit 1
          fi

      - name: Prune stale UTM packages
        run: |
          # The runner reuses its out/ tree across builds, so old dated
          # UTM-VM*.zip packages accumulate and the Publish/Attest globs would
          # upload every historical build. Keep only the newest package per
          # target so the release carries a single, current UTM image.
          for target in virtio_arm64only virtio_x86_64; do
            utm_dir="android/lineage/out/target/product/$target/VirtualMachine/UTM"
            [[ -d "$utm_dir" ]] || continue
            newest=$(ls -t "$utm_dir"/UTM-VM*.zip 2>/dev/null | head -1)
            [[ -n "$newest" ]] || continue
            for f in "$utm_dir"/UTM-VM*.zip; do
              if [[ "$f" != "$newest" ]]; then
                echo "pruning stale UTM package: $f"
                rm -f "$f"
              fi
            done
            echo "kept: $newest"
          done

      - name: Publish ARM64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'arm64only' || inputs.target == 'all'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            boot_arm64only.img
            recovery_arm64only.img
            recovery_arm64only-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip

      - name: Publish x86_64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'all'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            boot_x86_64.img
            recovery_x86_64.img
            recovery_x86_64-userdebug.img
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip

      - name: Attest ARM64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'arm64only' || inputs.target == 'all'
        uses: actions/attest@v4
        with:
          subject-path: |
            boot_arm64only.img
            recovery_arm64only.img
            recovery_arm64only-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip

      - name: Attest x86_64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'all'
        uses: actions/attest@v4
        with:
          subject-path: |
            boot_x86_64.img
            recovery_x86_64.img
            recovery_x86_64-userdebug.img
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip
