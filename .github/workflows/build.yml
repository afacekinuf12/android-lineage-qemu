name: Build Android images

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: true
        type: string
        default: "self-hosted" # ubuntu-latest
      target:
        description: "Build target"
        required: true
        type: choice
        options:
          - arm64only
          - x86_64
          - all
        default: arm64only
      proxy:
        description: "Optional ALL_PROXY URL"
        required: false
        type: string
        default: ""
      skip_sync:
        description: "Reuse the runner's existing LineageOS source tree"
        required: false
        type: boolean
        default: false
      skip_checkout:
        description: "Reuse the runner's existing workflow checkout"
        required: false
        type: boolean
        default: false
      reuse_output:
        description: "Verify and publish existing completed build output"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 */16 * *"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
      - id: check
        run: |
          source common.sh
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! check_version; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - name: Clear stale runner proxy
        if: github.event_name != 'workflow_dispatch' || inputs.skip_checkout != true
        run: |
          git config --global --unset-all http.proxy || true
          git config --global --unset-all https.proxy || true
          git config --global --unset-all http.https://github.com.proxy || true

      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch' || inputs.skip_checkout != true
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        with:
          clean: false

      - name: Validate cached checkout
        if: github.event_name == 'workflow_dispatch' && inputs.skip_checkout == true
        run: |
          test -d .git
          test -x build.sh
          git log -1 --oneline

      - name: Refresh cached identity patch
        if: github.event_name == 'workflow_dispatch' && inputs.skip_checkout == true
        run: |
          echo '' |
            base64 --decode > patches/0007-virtio-arm64-consistent-product-identity.patch
          echo '' |
            base64 --decode > scripts/verify-build-identity.sh

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          SKIP_REPO_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_sync || false }}
          ALL_PROXY: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy || '' }}
          NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,.byted.org
        run: |
          if [[ "${{ inputs.reuse_output }}" == true ]]; then
            product_out=android/lineage/out/target/product/virtio_arm64only
            bash -x scripts/verify-build-identity.sh "$product_out"
            cp "$product_out/boot.img" boot_arm64only.img
            cp "$product_out/recovery.img" recovery_arm64only.img
          elif ! ./build.sh; then
            product_out=android/lineage/out/target/product/virtio_arm64only
            for prop in "$product_out"/system/build.prop "$product_out"/vendor/build.prop; do
              if [[ -f "$prop" ]]; then
                echo "Diagnostic properties from $prop:"
                grep -E '^(ro\.build\.fingerprint|ro\.product\.|ro\.soc\.)' "$prop" || true
              fi
            done
            exit 1
          fi

      - name: Publish ARM64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'arm64only' || inputs.target == 'all'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            boot_arm64only.img
            recovery_arm64only.img
            recovery_arm64only-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip

      - name: Publish x86_64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'all'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            boot_x86_64.img
            recovery_x86_64.img
            recovery_x86_64-userdebug.img
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip

      - name: Attest ARM64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'arm64only' || inputs.target == 'all'
        uses: actions/attest@v4
        with:
          subject-path: |
            boot_arm64only.img
            recovery_arm64only.img
            recovery_arm64only-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip

      - name: Attest x86_64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'all'
        uses: actions/attest@v4
        with:
          subject-path: |
            boot_x86_64.img
            recovery_x86_64.img
            recovery_x86_64-userdebug.img
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip
