name: Build Android images

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: true
        type: string
        default: "self-hosted" # ubuntu-latest
      target:
        description: "Build target"
        required: true
        type: choice
        options:
          - arm64only
          - x86_64
          - all
        default: arm64only
      proxy:
        description: "Optional ALL_PROXY URL"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 0 */16 * *"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
      - id: check
        run: |
          source common.sh
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! check_version; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          ALL_PROXY: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy || '' }}
          NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,.byted.org
        run: |
          ./build.sh

      - name: Publish ARM64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'arm64only' || inputs.target == 'all'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            boot_arm64only.img
            recovery_arm64only.img
            recovery_arm64only-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip

      - name: Publish x86_64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'all'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            boot_x86_64.img
            recovery_x86_64.img
            recovery_x86_64-userdebug.img
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip

      - name: Attest ARM64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'arm64only' || inputs.target == 'all'
        uses: actions/attest@v4
        with:
          subject-path: |
            boot_arm64only.img
            recovery_arm64only.img
            recovery_arm64only-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip

      - name: Attest x86_64
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'all'
        uses: actions/attest@v4
        with:
          subject-path: |
            boot_x86_64.img
            recovery_x86_64.img
            recovery_x86_64-userdebug.img
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip
